{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="card-title mb-4 text-center">Edit Book</h2>
        <form method="post" enctype="multipart/form-data">
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" name="title" class="form-control" value="{{ book['title'] }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Author</label>
            <input type="text" name="author" class="form-control" value="{{ book['author'] }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Year</label>
            <input type="number" name="year" class="form-control" value="{{ book['year'] }}">
          </div>
          <div class="mb-3">
            <label class="form-label">Category</label>
            <input type="text" name="category" class="form-control" value="{{ book['category'] }}">
          </div>
          <div class="mb-3">
            <label class="form-label">Change Image</label>
            <input type="file" name="image" class="form-control">
            {% if book['image_path'] %}
              <img src="{{ url_for('static', filename=book['image_path'].split('static/')[1]) }}" class="img-thumbnail mt-2" style="height:150px;">
            {% endif %}
          </div>
          <div class="mb-3">
            <label class="form-label">Book Link</label>
            <input type="url" name="link" class="form-control" value="{{ book['link'] }}">
          </div>
          <div class="d-flex gap-2 justify-content-center">
            <button type="submit" class="btn btn-success">Update</button>
            <a href="/" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
