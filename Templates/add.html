{% extends "base.html" %}

{% block content %}
<div class="container my-5">
  <div class="card shadow-lg p-4" style="max-width: 700px; margin: auto; background-color: rgba(255, 249, 249, 0.2); color: white;">
    <div class="card-body">
      <h2 class="card-title text-center mb-4" style=" color:rgb(66, 89, 171)">➕ Add New Book</h2>
      <form method="post" enctype="multipart/form-data">
        
        <div class="mb-3">
          <label class="form-label">Title</label>
          <input type="text" name="title" class="form-control" required>
        </div>
        
        <div class="mb-3">
          <label class="form-label">Author</label>
          <input type="text" name="author" class="form-control" required>
        </div>
        
        <div class="mb-3">
          <label class="form-label">Year</label>
          <input type="number" name="year" class="form-control">
        </div>
        
        <div class="mb-3">
          <label class="form-label">Category</label>
          <input type="text" name="category" class="form-control">
        </div>
        
        <div class="mb-3">
          <label class="form-label">Upload Image</label>
          <input type="file" name="image" class="form-control">
        </div>
        
        <div class="mb-3">
          <label class="form-label">Book Link</label>
          <input type="url" name="link" class="form-control" placeholder="https://example.com/book.pdf">
        </div>
        
        <div class="d-flex justify-content-between">
          <button type="submit" class="btn btn-success">💾 Save</button>
          <a href="/" class="btn btn-secondary">❌ Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
