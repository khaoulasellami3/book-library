<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>📚 Book Library</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
body {
  min-height: 100vh;
  margin: 0;
  background: linear-gradient(270deg,  #e6d5f9, #a6c1ee);
  background-size: 800% 800%;
  animation: gradientMove 50s ease infinite;
}

/* Animation */
@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* NAVBAR */
.navbar {
  background-color: rgba(216, 216, 216, 0.292) !important; 
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.navbar .nav-link,
.navbar .navbar-brand {
  color: #ffffff !important;
  font-weight: 500;
}

/* BUTTONS */
.btn-primary {
  background-color: #ff7f50;    
  border: none;
  color: #ffffff;
}

.btn-warning {
  background-color: #ffb347;   
  border: none;
  color: #ffffff;
}

.btn-danger {
  background-color: #ff6b6b;  
  border: none;
  color: #ffffff;
}

.btn-outline-primary {
  background-color: rgba(255, 127, 80, 0.2);   
  border: 1px solid #ff7f50;
  color: #ff7f50; 
}

/* CARDS */
.card {
  background-color: rgba(255, 255, 255, 0.18);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);  
  color: #ffffff;  
  border-radius: 12px;
}

.card-subtitle {
  color: #f9f9f9;   
  font-style: italic;
}

.card .btn {
  color: #ffffff;
  border-color: #ffffff;
}

.card .btn:hover {
  background-color: #ffffff;
  color: #000000;
}

/* IMAGES */
.card-img-top {
  width: 100%;            
  height: 200px;          
  object-fit: cover; 
  margin-top: 10px;    
  margin-bottom: 10px;    
  border-radius: 8px;     
}

.card-body {
  padding: 16px;
}



  .btn-outline-success {
   background-color: #f560a1;  
    border: none;
    color: #fff;  
  }
</style>

</head>
<body class="container mt-4">

 
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
     <a class="navbar-brand d-flex align-items-center" href="/">
  <img src="{{ url_for('static', filename='images/books.png') }}" alt="Book Logo" width="30" height="30" class="me-2">
  Book Library
</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
    <div class="collapse navbar-collapse" id="navbarNav">
     
      <ul class="navbar-nav mx-auto gap-5">
        <li class="nav-item">
          <a class="nav-link active" href="/">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/add">Add Book</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/export">Export</a>
        </li>
      </ul>
    </div>
    </div>
  </nav>

  
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
